[package]
name = "fusion-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "genix"
path = "src/main.rs"

[dependencies]
fusion-core = { path = "../core" }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.32"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tempfile = "3"
ehttp = "0.7.1"
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.3"
objc2-foundation = { version = "0.2.2", features = ["NSAppleEventManager", "NSAppleEventDescriptor", "NSNotification", "NSURL", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSMenu", "NSMenuItem"] }

[dev-dependencies]
png = "0.17"

[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "genix"
maintainer = "Daniel Krinets <daniel.krinets@gmail.com>"
copyright = "2026, Daniel Krinets"
license-file = ["../../LICENSE", "0"]
extended-description = "Genix is a parametric 3D CAD: sketches with constraints, extrude, revolve, shell, fillet, feature history, DXF and photo import."
section = "graphics"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/genix", "usr/bin/", "755"],
    ["../../packaging/linux/genix.desktop", "usr/share/applications/genix.desktop", "644"],
    ["../../packaging/macos/AppIcon.iconset/icon_256x256.png", "usr/share/icons/hicolor/256x256/apps/genix.png", "644"],
]

[package.metadata.generate-rpm]
name = "genix"
license = "MIT"
summary = "Parametric 3D CAD"
url = "https://github.com/danielkrinets/Genix"
assets = [
    { source = "target/release/genix", dest = "/usr/bin/genix", mode = "755" },
    { source = "packaging/linux/genix.desktop", dest = "/usr/share/applications/genix.desktop", mode = "644" },
    { source = "packaging/macos/AppIcon.iconset/icon_256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/genix.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/genix/LICENSE", mode = "644", doc = true },
]
